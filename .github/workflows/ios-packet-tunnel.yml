name: Verify iOS Packet Tunnel target

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/setup-ios-packet-tunnel.rb'
      - '.github/workflows/ios-packet-tunnel.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/setup-ios-packet-tunnel.rb'
      - '.github/workflows/ios-packet-tunnel.yml'

permissions:
  contents: read

jobs:
  packet-tunnel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Verify Xcode extension target
        run: |
          gem install --user-install xcodeproj --no-document
          ruby scripts/setup-ios-packet-tunnel.rb
      - name: Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Build unsigned app and embedded extension
        working-directory: app
        run: flutter build ios --release --no-codesign
