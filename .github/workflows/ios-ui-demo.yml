name: Build unsigned iOS UI demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Remove VPN extension from UI-only preview
        run: |
          gem install --user-install xcodeproj --no-document
          ruby scripts/prepare-ios-ui-demo.rb
      - name: Build unsigned visual preview
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Package unsigned app for local personal signing
        run: |
          mkdir -p build/ios-demo/Payload
          cp -R app/build/ios/iphoneos/Runner.app build/ios-demo/Payload/Runner.app
          cd build/ios-demo
          /usr/bin/zip -qry AkadVPN-iOS-UI-Demo-unsigned.ipa Payload
      - name: Upload UI-only demo
        uses: actions/upload-artifact@v4
        with:
          name: AkadVPN-iOS-UI-Demo-unsigned
          path: build/ios-demo/AkadVPN-iOS-UI-Demo-unsigned.ipa
          if-no-files-found: error
