name: Verify iOS icons

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate icons from Akad Web artwork
        run: |
          python3 -m venv "$RUNNER_TEMP/akad-python"
          "$RUNNER_TEMP/akad-python/bin/python" -m pip install --quiet pillow
          "$RUNNER_TEMP/akad-python/bin/python" app/tool/app_icons.py
      - name: Ensure committed icons match source artwork
        run: git diff --exit-code -- app/ios/Runner/Assets.xcassets/AppIcon.appiconset
