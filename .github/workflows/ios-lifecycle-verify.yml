name: Verify iOS core lifecycle bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Build Go XCFramework
        working-directory: core
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          "$(go env GOPATH)/bin/gomobile" init
          mkdir -p ../build/ios
          "$(go env GOPATH)/bin/gomobile" bind -target=ios -o ../build/ios/AkadCore.xcframework ./mobile
      - name: Verify Packet Tunnel Xcode project
        run: |
          gem install --user-install xcodeproj --no-document
          AKAD_LINK_IOS_CORE=1 ruby scripts/setup-ios-packet-tunnel.rb
      - name: Build unsigned iOS host and extension
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
